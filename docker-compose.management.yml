# Optional local PostgreSQL; combine with either existing gateway Compose file.
# Gateways deliberately have no DB depends_on: ENV data-plane startup is independent.
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: socketfabric
      POSTGRES_USER: socketfabric_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an independent PostgreSQL development password}
    ports:
      - "127.0.0.1:${MANAGEMENT_DB_PORT:-5432}:5432"
    volumes:
      - management_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socketfabric_owner -d socketfabric"]
      interval: 2s
      timeout: 2s
      retries: 15
    stop_grace_period: 15s
volumes:
  management_postgres:
